# Application Gateway -> this VM :80 (nginx) -> API on 127.0.0.1:8000
#
# TLS ends at the gateway, so nginx only speaks plain HTTP. The gateway's health
# probe should hit /health on port 80.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # registrations and payments are small JSON; nothing larger belongs here
    client_max_body_size 2m;

    access_log /var/log/nginx/gradorra-api.access.log;
    error_log  /var/log/nginx/gradorra-api.error.log;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # the gateway sets this to https; pass it through rather than claim http
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        proxy_connect_timeout 10s;
        # verify calls Razorpay server to server; give it room
        proxy_read_timeout    60s;
    }
}
