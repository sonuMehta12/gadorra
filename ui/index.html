<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GPET Registration — test UI</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.2/babel.min.js"></script>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--ink:#14161a;--muted:#5f6672;--line:#e3e6ea;--brand:#e8681f;--ok:#0f7b3d;--err:#b42318;--radius:10px}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#111316;--card:#191c20;--ink:#e9ecf1;--muted:#9aa3af;--line:#2a2f36;--brand:#f59157;--ok:#4ade80;--err:#f87171}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:560px;margin:0 auto;padding:24px 16px 64px}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px}
  .card h2{font-size:14px;margin:0 0 14px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
  label{display:block;font-size:13px;margin:12px 0 5px;color:var(--muted)}
  input,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:15px}
  input:focus,select:focus{outline:2px solid var(--brand);outline-offset:-1px}
  button{width:100%;padding:11px 14px;border:0;border-radius:8px;background:var(--brand);color:#fff;font-size:15px;font-weight:600;cursor:pointer;margin-top:16px}
  button:disabled{opacity:.5;cursor:not-allowed}
  button.ghost{background:transparent;color:var(--brand);border:1px solid var(--line);font-weight:500}
  .row{display:flex;gap:10px}.row>*{flex:1}
  .msg{padding:10px 12px;border-radius:8px;font-size:13px;margin-top:12px;white-space:pre-wrap;word-break:break-word}
  .msg.err{background:color-mix(in srgb,var(--err) 12%,transparent);color:var(--err)}
  .msg.ok{background:color-mix(in srgb,var(--ok) 12%,transparent);color:var(--ok)}
  .check{display:flex;gap:9px;align-items:flex-start;margin-top:14px}
  .check input{width:auto;margin-top:3px}
  .check span{font-size:13px;color:var(--muted)}
  .ack{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:19px;font-weight:700;letter-spacing:.02em;padding:14px;background:var(--bg);border:1px dashed var(--line);border-radius:8px;text-align:center;margin:12px 0;word-break:break-all}
  .steps{display:flex;gap:6px;margin-bottom:18px}
  .steps div{flex:1;height:3px;border-radius:2px;background:var(--line)}
  .steps div.on{background:var(--brand)}
  .kv{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line)}
  .kv:last-child{border:0}.kv span:first-child{color:var(--muted)}

  .eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:11px;font-weight:700;color:var(--brand);text-align:center}
  h1{text-align:center;font-size:24px;margin:6px 0 4px}
  .sub{text-align:center}
  textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;resize:vertical}
  .inline{display:flex;gap:8px}.inline input{flex:1}
  .inline button{width:auto;margin-top:0;white-space:nowrap;padding:10px 16px}
  button.outline{background:transparent;color:var(--brand);border:1px solid var(--brand);font-weight:600}
  .hint{font-size:12px;color:var(--muted);margin-top:6px}
  .hint.center{text-align:center}
  .fee{display:flex;justify-content:space-between;align-items:center;gap:12px;background:color-mix(in srgb,var(--brand) 7%,transparent);border:1px solid color-mix(in srgb,var(--brand) 22%,transparent);border-radius:10px;padding:14px;margin-top:18px}
  .fee-label{font-size:12px;color:var(--muted)}
  .fee-amount{font-size:26px;font-weight:800;margin-top:2px}
  .fee-right{text-align:right;font-size:13px}
  .save{color:var(--ok);font-size:12px;font-weight:600}
  .tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok);padding:3px 7px;border-radius:99px;vertical-align:middle}
  @media (max-width:480px){.row{flex-direction:column;gap:0}.inline{flex-direction:column}.inline button{width:100%}}
  .btnlink{display:block;text-align:center;padding:11px 14px;border-radius:8px;border:1px solid var(--brand);color:var(--brand);text-decoration:none;font-weight:600;font-size:14px}
  .btnlink.solid{background:var(--brand);color:#fff}
  pre{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:11px;overflow:auto;max-height:180px;margin:10px 0 0}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;
const API = "/api/v1";

async function call(path, { method = "GET", body, token } = {}) {
  const headers = { "Content-Type": "application/json" };
  if (token) headers["X-Form-Token"] = token;
  const r = await fetch(API + path, { method, headers, body: body ? JSON.stringify(body) : undefined });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) {
    const d = data.detail || data;
    throw new Error(d.message || d.detail || JSON.stringify(d));
  }
  return data;
}
const rupees = (p) => "₹" + (p / 100).toFixed(0);

function App() {
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const [note, setNote] = useState("");

  const [cfg, setCfg] = useState(null);
  const [districts, setDistricts] = useState([]);

  const [form, setForm] = useState({
    full_name: "", father_name: "", class_level: "", district_id: "",
    address_line: "", email: "", consent_whatsapp: false, acknowledgement_number: "",
  });
  const [mobile, setMobile] = useState("");
  const [otpSent, setOtpSent] = useState(false);
  const [code, setCode] = useState("");
  const [token, setToken] = useState("");

  const [registration, setRegistration] = useState(null);
  const [result, setResult] = useState(null);
  const [lookup, setLookup] = useState(null);

  const stage = result ? 3 : registration ? 2 : 1;

  useEffect(() => {
    call("/config/phase").then(setCfg).catch((e) => setErr(e.message));
    call("/masters/districts").then(setDistricts).catch((e) => setErr(e.message));
  }, []);

  const run = async (fn) => {
    setBusy(true); setErr(""); setNote("");
    try { await fn(); } catch (e) { setErr(e.message); } finally { setBusy(false); }
  };

  const detailsFilled =
    form.full_name.trim().length >= 2 &&
    form.father_name.trim().length >= 2 &&
    form.class_level &&
    form.district_id &&
    form.address_line.trim().length >= 5 &&
    mobile.length === 10;

  const sendOtp = () => run(async () => {
    const r = await call("/otp/send", { method: "POST", body: { mobile } });
    setOtpSent(true);
    setNote(r.dev_code ? `OTP sent over ${r.channel}. Dev code: ${r.dev_code}` : `OTP sent to ${mobile} on WhatsApp.`);
    if (r.dev_code) setCode(r.dev_code);
  });

  // one button: verify the OTP, create the registration, open checkout
  const proceed = () => run(async () => {
    const v = await call("/otp/verify", { method: "POST", body: { mobile, code } });
    setToken(v.form_token);

    const body = {
      ...form,
      class_level: Number(form.class_level),
      district_id: Number(form.district_id),
      email: form.email || null,
    };
    if (!body.acknowledgement_number) delete body.acknowledgement_number;
    const reg = await call("/registrations", { method: "POST", body, token: v.form_token });
    setRegistration(reg);
    await openCheckout(reg);
  });

  const openCheckout = async (reg) => {
    const order = await call("/payments/order", { method: "POST", body: { registration_id: reg.id } });
    const rzp = new window.Razorpay({
      key: order.razorpay_key_id,
      amount: order.amount_paise,
      currency: order.currency,
      name: "GPET 2026",
      description: cfg && cfg.phase === "PRE_LAUNCH" ? "Pre-registration fee" : "Registration fee",
      order_id: order.razorpay_order_id,
      prefill: { name: reg.student.full_name, contact: reg.student.mobile, email: reg.student.email || "" },
      theme: { color: "#e8681f" },
      handler: (res) => run(async () => {
        const v = await call("/payments/verify", { method: "POST", body: res });
        setResult(v);
      }),
      modal: { ondismiss: () => setNote("Checkout closed. Your details are saved — press Pay to try again.") },
    });
    rzp.on("payment.failed", (e) => setErr(e.error.description || "Payment failed"));
    rzp.open();
  };

  const doLookup = (payload) => run(async () => {
    const r = await call("/acknowledgements/lookup", { method: "POST", body: payload, token });
    setLookup(r);
  });

  const reset = () => {
    setForm({ full_name: "", father_name: "", class_level: "", district_id: "", address_line: "", email: "", consent_whatsapp: false, acknowledgement_number: "" });
    setMobile(""); setCode(""); setOtpSent(false); setToken("");
    setRegistration(null); setResult(null); setLookup(null); setErr(""); setNote("");
  };

  return (
    <div className="wrap">
      <div className="eyebrow">Student information</div>
      <h1>Complete Your Pre-Registration</h1>
      <div className="sub">Enter your details carefully. All mandatory fields must be completed.</div>

      <div className="steps">{[1, 2, 3].map((n) => <div key={n} className={stage >= n ? "on" : ""} />)}</div>

      {stage === 1 && (
        <div className="card">
          <div className="row">
            <div>
              <label>Student's full name *</label>
              <input value={form.full_name} onChange={(e) => setForm({ ...form, full_name: e.target.value })} placeholder="Enter full name" />
            </div>
            <div>
              <label>Father's name *</label>
              <input value={form.father_name} onChange={(e) => setForm({ ...form, father_name: e.target.value })} placeholder="Enter father's name" />
            </div>
          </div>

          <div className="row">
            <div>
              <label>Class *</label>
              <select value={form.class_level} onChange={(e) => setForm({ ...form, class_level: e.target.value })}>
                <option value="">Select your class</option>
                {[9, 10, 11, 12].map((c) => <option key={c} value={c}>Class {c}</option>)}
              </select>
            </div>
            <div>
              <label>District *</label>
              <select value={form.district_id} onChange={(e) => setForm({ ...form, district_id: e.target.value })}>
                <option value="">Select your district</option>
                {districts.map((d) => <option key={d.id} value={d.id}>{d.name}</option>)}
              </select>
            </div>
          </div>

          <label>Complete address *</label>
          <textarea value={form.address_line} onChange={(e) => setForm({ ...form, address_line: e.target.value })} placeholder="Enter your complete address" rows={3} />

          <label>Email (optional)</label>
          <input value={form.email} onChange={(e) => setForm({ ...form, email: e.target.value })} placeholder="not used in this phase" />

          {cfg && cfg.phase === "POST_LAUNCH" && (
            <>
              <label>Acknowledgement number (if you pre-registered)</label>
              <input value={form.acknowledgement_number} onChange={(e) => setForm({ ...form, acknowledgement_number: e.target.value })} placeholder="GPET26/UP49/12345" />
            </>
          )}

          <label>Mobile number (WhatsApp) *</label>
          <div className="inline">
            <input value={mobile} onChange={(e) => { setMobile(e.target.value.replace(/\D/g, "").slice(0, 10)); setOtpSent(false); setCode(""); }} placeholder="Enter 10-digit WhatsApp number" inputMode="numeric" />
            <button className="outline" onClick={sendOtp} disabled={busy || mobile.length !== 10 || !detailsFilled}>
              {otpSent ? "Resend OTP" : "Send OTP"}
            </button>
          </div>
          <div className="hint">
            {detailsFilled ? "Your acknowledgement number will be sent to this WhatsApp number." : "Fill the details above, then verify your mobile."}
          </div>

          {otpSent && (
            <>
              <label>Enter the OTP sent to {mobile}</label>
              <input value={code} onChange={(e) => setCode(e.target.value.replace(/\D/g, "").slice(0, 6))} placeholder="6-digit code" inputMode="numeric" />
            </>
          )}

          <div className="check">
            <input type="checkbox" id="c" checked={form.consent_whatsapp} onChange={(e) => setForm({ ...form, consent_whatsapp: e.target.checked })} />
            <span>By clicking proceed, I agree to the GPET 2026 Terms &amp; Conditions and Privacy Policy, and to receive updates on WhatsApp.</span>
          </div>

          {cfg && (
            <div className="fee">
              <div>
                <div className="fee-label">{cfg.phase === "PRE_LAUNCH" ? "Pre-registration fee" : "Registration fee"}</div>
                <div className="fee-amount">{rupees(cfg.fee_paise)} <span className="tag">fixed fee</span></div>
              </div>
              {cfg.phase === "PRE_LAUNCH" && (
                <div className="fee-right">
                  <div className="fee-label">Post-registration</div>
                  <div><s>₹499</s> <b>₹299</b></div>
                  <div className="save">Save ₹200</div>
                </div>
              )}
            </div>
          )}

          <button onClick={proceed} disabled={busy || !detailsFilled || !otpSent || code.length < 4 || !form.consent_whatsapp}>
            {busy ? "Please wait…" : `Proceed to Pre-Registration →`}
          </button>
          <div className="hint center">By proceeding, you confirm that the information provided by you is correct.</div>
          <div className="hint center">Test mode — UPI: <b>success@razorpay</b> · Card: <b>4100 2800 0000 1007</b> (4111… is an international card and will be rejected)</div>
        </div>
      )}

      {stage === 2 && registration && (
        <div className="card">
          <h2>Payment</h2>
          <div className="kv"><span>Name</span><span>{registration.student.full_name}</span></div>
          <div className="kv"><span>Father's name</span><span>{registration.student.father_name}</span></div>
          <div className="kv"><span>Mobile</span><span>{registration.student.mobile}</span></div>
          <div className="kv"><span>Class</span><span>{registration.class_level}</span></div>
          <div className="kv"><span>Status</span><span>{registration.status}</span></div>
          {registration.discount_paise > 0 && <div className="kv"><span>Discount</span><span>-{rupees(registration.discount_paise)}</span></div>}
          <div className="kv"><span>Payable</span><span><b>{rupees(registration.fee_amount_paise)}</b></span></div>
          <button onClick={() => run(() => openCheckout(registration))} disabled={busy}>Pay {rupees(registration.fee_amount_paise)}</button>
          <div className="hint center">Test mode — UPI: <b>success@razorpay</b> · Card: <b>4100 2800 0000 1007</b>, any future expiry, any CVV, then any 4–10 digit OTP.</div>
        </div>
      )}

      {stage === 3 && result && (
        <div className="card">
          <h2>Registration complete</h2>
          <div className="msg ok">{result.message}</div>
          {result.acknowledgement_number && (
            <>
              <div className="hint" style={{ marginTop: 14 }}>Your acknowledgement number — save it, you will need it at final registration.</div>
              <div className="ack">{result.acknowledgement_number}</div>
              <div className="hint center">Also sent to your WhatsApp.</div>
            </>
          )}
          <div className="row" style={{ marginTop: 16 }}>
            <a className="btnlink" href={`/api/v1/receipts/${result.registration_id}/view`} target="_blank" rel="noreferrer">View / print receipt</a>
            <a className="btnlink solid" href={`/api/v1/receipts/${result.registration_id}/receipt.pdf`}>Download PDF</a>
          </div>
          <button className="outline" onClick={reset}>Start another registration</button>
        </div>
      )}

      {token && (
        <div className="card">
          <h2>Lookup (post-launch)</h2>
          <div className="row">
            <button className="outline" onClick={() => doLookup({ mobile })} disabled={busy}>By my mobile</button>
            <button className="outline" onClick={() => { const n = prompt("Acknowledgement number"); if (n) doLookup({ acknowledgement_number: n }); }} disabled={busy}>By ack number</button>
          </div>
          {lookup && <pre>{JSON.stringify(lookup, null, 2)}</pre>}
        </div>
      )}

      {err && <div className="msg err">{err}</div>}
      {note && <div className="msg ok">{note}</div>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
