# Render blueprint: API + Postgres in one place.
#
# The free database expires 30 days after creation, with a 14-day grace period.
# Upgrading to a paid plan before then keeps the data. This setup is meant to
# unblock front-end work, not to run the launch -- that goes to AWS.

databases:
  - name: gradorra-db
    plan: free
    # Must match the service's region. Render's internal connection does not
    # cross regions, and a database cannot be moved after it is created.
    region: singapore
    databaseName: gradorra
    user: gradorra

services:
  - type: web
    name: gradorra-api
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      # wired automatically from the database above
      - key: DATABASE_URL
        fromDatabase:
          name: gradorra-db
          property: connectionString

      - key: JWT_SECRET
        generateValue: true

      - key: AUTO_INIT_DB          # first boot creates tables + the 75 districts
        value: "true"
      - key: APP_ENV
        value: production
      - key: CURRENT_PHASE
        value: PRE_LAUNCH

      - key: OTP_CHANNEL
        value: whatsapp_template
      - key: WHATSAPP_PROVIDER
        value: meta
      - key: WHATSAPP_ACK_CHANNEL
        value: template
      - key: WHATSAPP_AUTH_TEMPLATE_BUTTON
        value: "true"
      - key: WHATSAPP_API_VERSION
        value: v25.0
      - key: WHATSAPP_PHONE_NUMBER_ID
        value: "1355994020929287"
      - key: WHATSAPP_BUSINESS_ACCOUNT_ID
        value: "1290804439764703"
      - key: WHATSAPP_TEMPLATE_OTP
        value: gpet_otp
      - key: WHATSAPP_TEMPLATE_ACK
        value: gpet_acknowledgement
      - key: WHATSAPP_TEMPLATE_LANGUAGE
        value: en

      - key: EMAIL_ENABLED       # off: the client chose WhatsApp only for now
        value: "false"
      - key: EMAIL_PROVIDER
        value: smtp
      - key: EMAIL_FROM
        value: info@gradorra.in
      - key: EMAIL_FROM_NAME
        value: GPET 2026
      - key: EMAIL_REPLY_TO
        value: info@gradorra.in
      - key: EMAIL_ATTACH_RECEIPT
        value: "true"
      - key: SMTP_HOST
        value: smtp.office365.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: info@gradorra.in
      - key: SMTP_USE_TLS
        value: "true"

      - key: ACK_EXAM_CODE
        value: GPET26
      - key: ACK_STATE_PREFIX
        value: UP
      - key: FEE_PRELAUNCH_PAISE
        value: "9900"
      - key: FEE_POSTLAUNCH_PAISE
        value: "49900"
      - key: FEE_POSTLAUNCH_DISCOUNTED_PAISE
        value: "29900"

      # Set these in the dashboard, never here:
      #   WHATSAPP_TOKEN            permanent system-user token
      #   RAZORPAY_KEY_ID           rzp_test_... while the front end is being built
      #   RAZORPAY_KEY_SECRET
      #   RAZORPAY_WEBHOOK_SECRET
      #   CORS_ORIGINS              the front end's origins, comma separated
      #   SMTP_PASSWORD             the info@gradorra.in mailbox password
      - key: WHATSAPP_TOKEN
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SMTP_PASSWORD
        sync: false
